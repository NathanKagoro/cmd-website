[build]
command = "bash build.sh"
publish = "dist"

# Projects hosted on GitHub Pages (free, no Netlify credits).
# Old /laki and /mmm links keep working.
[[redirects]]
from = "/laki/*"
to = "https://nathankagoro.github.io/Laki-associates-demo-website/"
status = 301

[[redirects]]
from = "/laki"
to = "https://nathankagoro.github.io/Laki-associates-demo-website/"
status = 301

[[redirects]]
from = "/mmm/*"
to = "https://nathankagoro.github.io/MMM-Dashboard/:splat"
status = 301

[[redirects]]
from = "/mmm"
to = "https://nathankagoro.github.io/MMM-Dashboard/"
status = 301

# Stock Exchange (static, built from the submodule; runs entirely in the browser)
[[redirects]]
from = "/stock"
to = "/stock/index.html"
status = 301

[[redirects]]
from = "/stock/*"
to = "/stock/index.html"
status = 200

[[redirects]]
from = "/2048"
to = "/games/2048/"
status = 301

[[redirects]]
from = "/2048/*"
to = "/games/2048/"
status = 301

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
