[build]
command = "bash build.sh"
publish = "dist"

[functions]
directory = "netlify/functions"
included_files = ["projects/stock-exchange/backend/src/data/historical_stock_prices_2015_2025.csv"]
node_bundler = "esbuild"

# Projects hosted on GitHub Pages (free, no Netlify credits).
# Old /laki and /mmm links keep working.
[[redirects]]
from = "/laki/*"
to = "https://nathankagoro.github.io/Laki-associates-demo-website/"
status = 301

[[redirects]]
from = "/laki"
to = "https://nathankagoro.github.io/Laki-associates-demo-website/"
status = 301

[[redirects]]
from = "/mmm/*"
to = "https://nathankagoro.github.io/MMM-Dashboard/:splat"
status = 301

[[redirects]]
from = "/mmm"
to = "https://nathankagoro.github.io/MMM-Dashboard/"
status = 301

# Stock Exchange (built from the submodule)
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/stock-api/:splat"
status = 200

[[redirects]]
from = "/stock"
to = "/stock/index.html"
status = 301

[[redirects]]
from = "/stock/*"
to = "/stock/index.html"
status = 200

[[redirects]]
from = "/2048"
to = "/games/2048/entry/2048 entry.html"
status = 301

[[redirects]]
from = "/2048/*"
to = "/games/2048/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
